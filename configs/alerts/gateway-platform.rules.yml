# Prometheus 告警规则 —— gateway-platform（E1）
#
# 范围：本文件只交付**规则与阈值**。通知通道（谁收、怎么收）属部署边界，按 E1 DoD 不在此文件内。
#
# 阈值总声明：**下列所有阈值均未经真实流量校准。**
# 总览 §6.3.1 已声明冷却时长"待线上回调"，本平台也从未在真实流量下跑过。
# 每条规则的 `threshold_source` 注解写明该阈值是从哪推出来的；凡是标注
# `uncalibrated` 的，都只是"能让规则跑起来的起始值"，不是已验证结论。
# 上线后第一件事是按实际分布回调这些数字，而不是把它们当基线。
#
# 指标来源：全部取自 internal/observability 注册表实际发射的指标名，
# 由 internal/observability/alertrules_test.go 交叉校验——规则里引用了仓库里
# 不存在的指标，测试就红。
#
# job 标签由部署侧的 scrape 配置决定，本文件不假设其取值；
# gateway 与 control 是两个独立进程的注册表，规则按指标归属分组。

groups:
  # =========================================================================
  # 平台级出口健康 —— 总览 §6.3.1 规则 2。
  # 这一组的价值全在告警上：没有告警，"出口 IP / TLS 指纹被标记"就退化回
  # 一个号一个号烧着去发现。
  # =========================================================================
  - name: gateway-platform-egress
    rules:
      - alert: PlatformTransportRejection
        expr: control_platform_alert{reason="transport_rejections"} > 0
        for: 5m
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "{{ $labels.provider }} 多账号同时 transport 被拒，疑似出口 IP / TLS 指纹被标记"
          description: >-
            control 的平台级判定已置位（distinct 账号数 {{ $value }}）。
            这是平台问题不是账号问题：换号重试不会好转，先查出口 IP 与 utls profile。
          runbook: "docs/TODO.md §A9；总览 §6.3.1 规则 2"
          threshold_source: >-
            uncalibrated。判定阈值本身在代码里（internal/control 的平台级判定），
            这里只对"已判定"取 >0；for=5m 是为了滤掉单次抖动，未经真实流量校准。

      - alert: PlatformTransportRejectionSpread
        expr: control_platform_transport_rejections_accounts > 3
        for: 10m
        labels:
          severity: warning
          scope: platform
        annotations:
          summary: "{{ $labels.provider }} 有 {{ $value }} 个账号处于 transport 拒绝态"
          description: >-
            与 PlatformTransportRejection 互为补充：这条看的是**广度**，
            在平台级判定尚未置位时提前给出信号。
          threshold_source: >-
            uncalibrated。>3 是"超过单账号偶发"的经验取值，无真实分布支撑。

      - alert: StarvationGateFired
        expr: increase(control_platform_starvation_release_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          scope: platform
        annotations:
          summary: "{{ $labels.platform }} 防饿死闸触发"
          description: >-
            防饿死释放意味着调度已经在异常区间工作。单次即告警，因为它本身就是
            "系统已经在补救"的信号，不是常态。
          threshold_source: >-
            uncalibrated。取 >0（任意一次即报）是因为该路径设计上应罕见；
            若上线后发现它常态触发，要回调的是闸本身而不是这条规则。
            A22："设计上应罕见"正是 `increase()` 看不见的那种事件——它取窗口内
            last−first，永远看不见把序列带进存在的那一次增量。`SnapshotLoop` 按
            `ListSnapshotBuckets` 读到的 platform 列表在启动时并每轮预置 0 序列，
            这条规则的可触发性依赖那个预置。已知残留：某 platform 的第一个账号在启动后
            才出现、且闸在同一轮内即触发时，仍会漏掉那一次。

  # =========================================================================
  # 事件流健康 —— 总览 §4.1 列为 P0 必须暴露的可验收指标。
  # =========================================================================
  - name: gateway-platform-stream
    rules:
      - alert: StreamDLQGrowing
        expr: increase(control_stream_dlq_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
          scope: stream
        annotations:
          summary: "release 流有消息进入 DLQ（reason={{ $labels.reason }}）"
          description: >-
            进 DLQ 的消息不会再被计量。任何非零增长都意味着**计费数据正在丢**，
            所以这里不设容忍窗口。
          threshold_source: >-
            由后果推出，非经验值：DLQ 直接对应计量缺口，可容忍量为 0。

      - alert: StreamPendingBacklog
        expr: control_stream_pending > 1000
        for: 10m
        labels:
          severity: warning
          scope: stream
        annotations:
          summary: "control 消费滞后，pending {{ $value }} 条"
          description: >-
            消费者跟不上网关的发布速率，或消费者挂了。持续积压会推高
            request_attempt_open_age_seconds，最终触发合成终态。
          threshold_source: >-
            uncalibrated。1000 与 10m 都是占位量级，正确取法是按实测
            "峰值 RPM × 可接受滞后秒数"重算。

      - alert: StreamPendingStuck
        expr: min_over_time(control_stream_pending[30m]) > 0 and increase(control_stream_reclaim_total[30m]) == 0
        for: 0m
        labels:
          severity: critical
          scope: stream
        annotations:
          summary: "pending 持续非零且 30 分钟无 reclaim，消费可能完全停摆"
          description: >-
            与 StreamPendingBacklog 的区别是这条不看量只看"动没动"：
            少量消息卡死不涨不消，量级告警永远不会响。
          threshold_source: >-
            由失效模式推出。30m 窗口 uncalibrated——它必须显著大于
            reclaim 周期，本轮未核对实际 reclaim 间隔。
            A23：`and` 是按标签取交集，右侧序列不存在时是空向量，交集为空、整条规则不产生
            任何结果。而"从未 reclaim 过"恰恰是最可能完全停摆的状态，这条 critical 曾在自己
            最该响的场景下必然沉默。`Consumer.PrimeMetrics` 在启动时把
            `control_stream_reclaim_total` 预置为 0，使 `== 0` 是一次真实比较而非缺失序列。

      - alert: UsageLedgerDuplicateSpike
        expr: increase(usage_ledger_duplicate_total[15m]) > 10
        for: 0m
        labels:
          severity: warning
          scope: stream
        annotations:
          summary: "15 分钟内 {{ $value }} 次重复入账被幂等挡下"
          description: >-
            少量重复是 at-least-once 的正常代价（幂等键已挡住）。
            持续大量重复说明重投递在放大，通常伴随 pending 积压或消费者反复重启。
          threshold_source: >-
            uncalibrated。>10 是"超过偶发"的占位值，无真实重投递率数据。

  # =========================================================================
  # 计量可信度 —— 总览 §4.1 明确要求"合成终态和 UsageSource=missing 的比例
  # 单独告警，不得被普通成功率掩盖"。这一组存在的理由就是这句话。
  # =========================================================================
  - name: gateway-platform-usage-trust
    rules:
      - alert: UsageSourceMissingRatioHigh
        expr: >-
          sum(rate(release_usage_missing_total[15m]))
          /
          clamp_min(sum(rate(release_xadd_total{result="success"}[15m])), 0.001)
          > 0.01
        for: 15m
        labels:
          severity: critical
          scope: usage-trust
        annotations:
          summary: "UsageSource=missing 占比 {{ $value | humanizePercentage }}"
          description: >-
            这些请求成功了但拿不到 usage，按 B4.3 口径进 held 等人工处理——
            即"钱算不出来"。它不会体现在成功率上，必须单独看。
          runbook: "docs/B4-BILLING-MODEL.md；docs/TODO.md §B4.3"
          threshold_source: >-
            uncalibrated。1% 是"任何一点计量缺口都值得追"的保守取值；
            clamp_min 防止零流量时除零。真实基线未知。

      - alert: SnapshotAccountsDropped
        expr: round(increase(control_snapshot_accounts_dropped_total[15m])) > 0
        for: 0m
        labels:
          severity: warning
          scope: usage-trust
        annotations:
          summary: "{{ $value }} 个账号因未声明 usage_integrity 被排除出快照（provider={{ $labels.provider }}）"
          description: >-
            总览 §6.2 的 fail-closed 强制：provider 未声明 usage_integrity 的账号不会进入快照，
            网关从此看不到它们。这是**静默的容量损失**——
            `stampUsageIntegrity` 的注释说得很直接："一个未注册的 provider 悄悄清空一个桶，
            看起来和『没配账号』一模一样"。在这条规则之前，唯一的可见性是一行日志。
            处置：给该 provider 注册 usage_integrity 策略，或确认这些账号本就不该启用。
          runbook: "docs/fluxgate-keyhive-overview.md §6.2；internal/control/snapshot_loop.go stampUsageIntegrity"
          threshold_source: >-
            取 >0 由 fail-closed 的语义推出：被丢弃的账号数可容忍为 0。
            窗口 15m 对齐快照循环的 1 分钟周期。
            A22 说明：这里用 `increase()` 是安全的，因为快照循环**每分钟重复发射**——
            配置错误持续存在时序列会持续增长，第二个 tick 起 `increase` 即可见。
            它不属于 A22 的"一次性事件"那一类，故不需要预置零序列；
            `provider` 标签的取值恰恰是**未注册的** provider，本来也无法枚举。

      - alert: SyntheticTerminalStateSpike
        expr: increase(request_attempt_recovered_total{source="synthetic"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
          scope: usage-trust
        annotations:
          summary: "15 分钟内出现 {{ $value }} 个合成终态"
          description: >-
            合成终态 = 网关从未回报，control 超时替它收尾。这类记录的 usage
            是推断出来的，不是上游给的。总览 §4.1 要求它单独告警。
          threshold_source: >-
            由 §4.1 的"单独告警"要求推出，取 >0。若上线后常态非零，
            要查的是网关回报路径，不是调高这个阈值。

      - alert: AttemptOpenAgeHigh
        expr: request_attempt_open_age_seconds > 900
        for: 5m
        labels:
          severity: warning
          scope: usage-trust
        annotations:
          summary: "最老的未闭合 attempt 已 {{ $value }} 秒"
          description: >-
            未闭合 attempt 持续变老是合成终态的前兆。
          threshold_source: >-
            uncalibrated。900s 是占位值，正确取法是按实际
            attempt 超时配置（DeadlineAt 跨度）对齐，本轮未核对该配置的生产取值。

  # =========================================================================
  # 计费闭环 —— B4.2 / B4.3 / B4.4 埋的指标在此前没有任何消费方。
  # =========================================================================
  - name: gateway-platform-billing
    rules:
      - alert: BillingHeldRowsAccumulating
        expr: control_billing_held_rows > 0
        for: 30m
        labels:
          severity: warning
          scope: billing
        annotations:
          summary: "有 {{ $value }} 条账目挂起待人工（usage_source={{ $labels.usage_source }}）"
          description: >-
            B4.3 决定"请求成功但 usage 完全丢失"的账目挂起待人工。
            held 行不会自己消失，处置入口是控制台的 held 托盘
            （`GET /v1/billing/held` 与 `POST /v1/billing/held/{event_id}/resolve`，
            见 docs/B5-CONSOLE.md §4.1）：`bill` 按 occurred_at 当时的单价计费，
            `write_off` 判定为零。B5 之前这条告警是它唯一的可见性。
          runbook: "docs/B5-CONSOLE.md §4.1；docs/B4-BILLING-MODEL.md"
          threshold_source: >-
            由 B4.3 的语义推出：held 的定义就是"需要人来看"，可容忍存量为 0。
            for=30m 只是给扣费作业一个自然周期，未经校准。

      - alert: BillingUnpricedRows
        expr: round(increase(control_billing_rows_total{state="unpriced"}[1h])) > 0
        for: 0m
        labels:
          severity: warning
          scope: billing
        annotations:
          summary: "扣费作业把 {{ $value }} 条用量判为 unpriced（我们的定价配置有缺口）"
          description: >-
            B4-BILLING-MODEL D6 要求"出现 `unpriced` 行即告警"。典型成因是
            **上新模型时忘了配价**：用量照常服务，但 `occurred_at` 时没有生效单价，
            D3 又禁止倒填，于是这笔收入**没有收到且不可能自动收到**。
            这与 held 是两件事——held 是"usage 丢了，需要人裁定"，
            unpriced 是"usage 好好的，是我们自己没配价"，两者不可相加。
            处置：先补 `POST /v1/billing/prices`（只对未来生效，救不了已发生的量），
            再对已发生的部分做显式钱包调整
            （`POST /v1/billing/wallets/{tenant_id}/adjust`，见 docs/B5-CONSOLE.md §4.4）。
          runbook: "docs/B4-BILLING-MODEL.md D3/D6；docs/B5-CONSOLE.md §4.3 与 §4.4"
          threshold_source: >-
            取 >0 由 unpriced 的**语义**推出：它的定义就是"我们的定价配置有缺口"，
            可容忍存量为 0，与 ConsoleHeldUnpricedResolution 同一口径。
            窗口取 1h 对齐扣费作业的自然周期；次数阈值本身不存在，故无需校准。
            A21：`increase()` 取窗口内 last−first，因此序列必须从 0 开始才可能算出非零——
            扣费作业在进程启动时预置四条 state 序列为 0（`BillingJob.PrimeMetrics`），
            这条规则的可触发性依赖那个预置。**A25 用 promtool 实测确认了这一条**：
            序列 0→3 后平稳时本规则触发且 `$value` = 3；序列诞生即为 3 时不触发。
            `round()` 不改变触发条件。**A25 修正了 A21 对它的说明**：A21 记的
            "单次 +1 常算成 1.0166…"对本规则的密集平坦序列**不成立**（实测返回精确的 3，
            此处 `round()` 是空操作）；它真正消去的是持续增长计数器上的浮点噪声——
            同类的 QuotaSnapshotNotDraining 去掉 `round()` 后实测返回 30.000000000000004。
            已知残留：进程重启后序列从 0 重建，Prometheus 判 counter reset 并补值，
            `$value` 会被夸大——这是无 `_created` 的计数器的固有行为，不是误报。

      - alert: BillingUncappedWalletTenants
        expr: control_billing_uncapped_wallet_tenants > 0
        for: 15m
        labels:
          severity: warning
          scope: billing
        annotations:
          summary: "{{ $value }} 个预付租户 rpm=0，透支无上界"
          description: >-
            B4.4 的余额执行点靠 rpm 给透支封顶；rpm=0 时这个上界不存在。
            这是配置问题，不是运行时问题——补 rpm 即可消除。
          threshold_source: >-
            由 B4.4 的推导推出：无界透支不可容忍，阈值为 0。

      - alert: BillingUnknownUsageClass
        expr: increase(control_billing_unknown_usage_class_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
          scope: billing
        annotations:
          summary: "扣费作业遇到 {{ $value }} 条无法归类的 usage"
          description: >-
            出现了 B4.3 五种状态之外的情况，说明口径与数据已经脱节。
            这类行既没被计费也没被显式豁免。
          threshold_source: >-
            由后果推出：口径外的账目不可容忍，阈值为 0。

      - alert: BillingBlockedTenantsSpike
        expr: control_billing_blocked_tenants > 0
        for: 30m
        labels:
          severity: info
          scope: billing
        annotations:
          summary: "{{ $value }} 个租户因余额不足被拦截"
          description: >-
            这是**设计内**行为（B4.4 快照下发拒绝新请求），不是故障。
            列为 info 是因为持续非零通常意味着商务侧要跟进充值，而不是工程侧要修。
          threshold_source: >-
            uncalibrated。取 >0 + 30m 只为可见性；若正常业务下常态非零，
            这条应当直接关掉而不是调高阈值。

      - alert: BillingReconciliationUnbalanced
        expr: control_billing_reconcile_balanced == 0
        for: 30m
        labels:
          severity: critical
          scope: billing
        annotations:
          summary: "计费对账不平衡"
          description: >-
            B4.5 的三方对账（usage_ledger / wallet_transactions / tenant_wallets）
            发现分歧。具体类别见 control_billing_reconcile_discrepancies{kind}，
            能归因到请求的差额带 event_id——用控制台
            `GET /v1/billing/reconcile` 取同一窗口的完整报告。
            **对账只读**，它不会自行修复，所以这条不会自己消失。
          runbook: "docs/B5-CONSOLE.md；docs/B4-BILLING-MODEL.md B4.5"
          threshold_source: >-
            由后果推出：账目对不平本身不可容忍，阈值为 0。
            for=30m 是为了跨过扣费作业的一个周期（billingRunInterval=5m），
            避免把"还没扣到"读成"对不平"；该 30m 未经真实流量校准。

      - alert: BillingReconciliationDiscrepancyKind
        expr: control_billing_reconcile_discrepancies > 0
        for: 30m
        labels:
          severity: warning
          scope: billing
        annotations:
          summary: "对账差额类别 {{ $labels.kind }}：{{ $value }} 处"
          description: >-
            按类别拆分的对账差额，与 BillingReconciliationUnbalanced 同源，
            存在的意义是让值班的人不必先去翻报告才知道是哪一类。
            wallet_balance_drift 尤其值得优先看——它意味着有人绕过流水改了余额。
          threshold_source: >-
            由后果推出：阈值为 0，与上一条同理。

      - alert: BillingReconciliationNotRunning
        expr: >-
          time() - control_billing_reconcile_last_success_seconds > 3600
        for: 15m
        labels:
          severity: warning
          scope: billing
        annotations:
          summary: "计费对账已 {{ $value | humanizeDuration }} 没有成功跑过"
          description: >-
            **这条的存在本身就是要点**：对账停摆与对账一直没发现问题，
            在所有差额 gauge 上长得一模一样（都是 0）。
            没有这条，一个死掉的对账循环会被读成"账目很健康"。
          threshold_source: >-
            由 reconcileRunInterval=15m 推出：3600s 给了四个周期的余量。
            未经真实流量校准。

  # =========================================================================
  # 请求明细（A12）—— 明细可丢是设计，但丢弃必须可见：
  # 静默丢明细和静默丢流量长得一模一样。
  # =========================================================================
  - name: gateway-platform-detail
    rules:
      - alert: DetailWriteFailing
        expr: increase(detail_flush_failures_total[15m]) > 0
        for: 10m
        labels:
          severity: warning
          scope: detail
        annotations:
          summary: "请求明细持续写入失败"
          description: >-
            ClickHouse 不可用或拒绝写入。**这不影响计量与 ACK**（A12 的核心保证），
            影响的是事后复盘能力。按 warning 处理，不要当计费事故升级。
          runbook: "docs/A12-REQUEST-DETAIL.md"
          threshold_source: >-
            uncalibrated。for=10m 是为了区分"重启抖动"与"真的挂了"，
            未经真实流量校准。

      - alert: DetailBufferSaturated
        expr: increase(detail_dropped_total{reason="buffer_full"}[15m]) > 0
        for: 10m
        labels:
          severity: warning
          scope: detail
        annotations:
          summary: "明细缓冲区满，正在丢弃记录"
          description: >-
            写入慢于流量。A12 的常量（BatchSize/FlushInterval/BufferSize）本就
            未经真实流量校准——这条告警响了，说明该回调它们了。
          threshold_source: >-
            uncalibrated，且这条规则的**用途之一就是产出校准数据**。

  # =========================================================================
  # 控制台（B5）—— 运营面的异常有两个方向，都得看得见：
  # 一是"有人在敲门"（鉴权拒绝），二是"有人在动钱"（写操作）。
  # 两者都不是客户端流量，误报代价低，但静默的代价高——运营在动钱这件事
  # 本身就该留下可查的痕迹。
  # =========================================================================
  - name: gateway-platform-console
    rules:
      - alert: ConsoleAuthRejections
        expr: increase(control_console_rejected_total[15m]) > 5
        for: 10m
        labels:
          severity: warning
          scope: console
        annotations:
          summary: "控制台持续收到未通过鉴权的请求（{{ $labels.path }}）"
          description: >-
            控制台只对持有运营 token 的调用方开放。持续被拒意味着有人在扫，
            或者某处的运营凭据配错了——两种都值得看一眼。
            注意：`GATEWAY_CONSOLE_TOKEN` 未配置时控制台整体不启动，
            所以这条规则响**不**是配置缺失导致的。
          runbook: "docs/B5-CONSOLE.md §2"
          threshold_source: >-
            uncalibrated。>5 次 / 15m 只是把"偶发手误"与"持续尝试"分开的起始值；
            真实值取决于控制台是否被暴露在可达网络上。

      - alert: ConsoleWalletTopUp
        expr: increase(control_console_topup_total[5m]) > 0
        for: 0m
        labels:
          severity: info
          scope: console
        annotations:
          summary: "有运营正在给租户钱包充值"
          description: >-
            充值会直接改变某个租户的可服务状态（B4.4 的余额门槛），
            因此是值得留痕的动作。流水与操作者记录在 `wallet_transactions` 的 note
            与 `billing_resolutions.operator`；这条规则只是"发生了"的即时可见性。
            列为 info：正常运营动作，不是故障。
          runbook: "docs/B5-CONSOLE.md §4.2"
          threshold_source: >-
            取 >0 且 for=0m 由这条规则的**用途**推出：它是审计信号而不是故障信号，
            延迟一分钟看见它没有意义，所以不设 for。次数阈值本身不存在，故无需校准。

      - alert: ConsoleWalletAdjustment
        expr: increase(control_console_adjustment_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          scope: console
        annotations:
          summary: "有运营对租户钱包做了显式调整（可正可负）"
          description: >-
            与 ConsoleWalletTopUp 同类的审计信号，但**级别更高**：调整是双向的、
            金额任意，是平台上唯一能把钱人工扣出去的入口（A15，见 docs/B5-CONSOLE.md §4.4）。
            操作者与 reason 记在 `wallet_transactions.note`——note 是这行唯一的审计凭据，
            且 `X-Operator` 是自声明的，核对时要结合别的证据。
            列为 warning 而非 info：充值只会让租户更能用，调整可以让租户少钱。
          runbook: "docs/B5-CONSOLE.md §4.4；docs/B4-BILLING-MODEL.md D3"
          threshold_source: >-
            取 >0 且 for=0m 由**用途**推出：审计信号而非故障信号，延迟看见没有意义。
            次数阈值本身不存在，故无需校准。

      - alert: ConsoleWalletIdReuse
        expr: increase(control_console_adjustment_conflict_total[1h]) > 0 or increase(control_console_topup_conflict_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          scope: console
        annotations:
          summary: "钱包写入因 id 复用被拒（{{ $value }} 次）"
          description: >-
            `wallet_transactions.id` 是**全局**主键，不按租户分命名空间。这条规则计的是
            被 409 拒掉的复用：同一 id 换了 kind、换了金额，或者撞上别的租户的行。
            这类请求**没有动钱**，但说明调用方的 id 生成规则有问题——在修好之前，
            运营以为做成的修正实际上一次都没生效。
            历史背景：这个路径曾经返回 200 `replayed:true` 并附上**另一条**流水
            （一次 -500 的调整拿回一条 +500 的充值），调整静默丢失。现在是 409。
          runbook: "docs/B5-CONSOLE.md §4.4"
          threshold_source: >-
            取 >0 由语义推出：一次 id 复用就意味着调用方的假设是错的，可容忍次数为 0。
            次数阈值本身不存在，故无需校准。

      - alert: ConsoleWalletReplay
        expr: increase(control_console_adjustment_replayed_total[1h]) > 0 or increase(control_console_topup_replayed_total[1h]) > 0
        for: 0m
        labels:
          severity: info
          scope: console
        annotations:
          summary: "钱包调整被作为重放返回（{{ $value }} 次）"
          description: >-
            同 id、同 kind、同金额的重复提交，返回原流水且不重复动钱——这是幂等键
            在正常工作。列为 info。但它也是"调用方在重试"的信号：若与
            ConsoleWalletIdReuse 同时升高，说明重试逻辑在拿同一个 id 试不同的内容。
          runbook: "docs/B5-CONSOLE.md §4.4"
          threshold_source: >-
            取 >0 由用途推出：可见性信号，不是故障阈值，无需校准。

      - alert: ConsoleHeldUnpricedResolution
        expr: increase(control_console_held_unpriced_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          scope: billing
        annotations:
          summary: "人工裁定计费的 held 行里，有行落到了 unpriced"
          description: >-
            运营要求按单价计费，但该行 `occurred_at` 时无生效单价（D3 禁止倒填），
            因此终态是 `unpriced` 而非 `billed`——**这笔收入没有收到，且不可能自动收到**，
            只能靠显式钱包调整修正（`POST /v1/billing/wallets/{tenant_id}/adjust`，
            A15 之前这个入口并不存在）。托盘在"清空"，但收入没有跟上，这条规则就是
            用来区分这两种"托盘在缩小"的。
          runbook: "docs/B5-CONSOLE.md §4.1 与 §4.4"
          threshold_source: >-
            取 >0 由 unpriced 的**语义**推出：它的定义就是"我们的定价配置有缺口"，
            可容忍存量为 0，与 held 桶同一口径；数值本身无待校准的余量。

  - name: gateway-platform-quota
    rules:
      - alert: QuotaSnapshotNotDraining
        expr: round(increase(quota_snapshot_reconcile_total{result="retry"}[30m])) > 0 or round(increase(quota_snapshot_reconcile_total{result="stale"}[30m])) > 0
        for: 15m
        labels:
          severity: warning
          scope: quota
        annotations:
          summary: "quota 快照对账没有正常排干（result={{ $labels.result }}，{{ $value }} 次）"
          description: >-
            `retry` 是一次对账失败后被排进重试，`stale` 是发布时发现 epoch 已被别人推进。
            偶发各有正当原因，持续出现意味着 quota outbox 没在排干——
            网关的选号读的是快照里的 quota，排不干就是在用**过期的余量**选账号。
            这个族此前在规则文件里一次都没出现（第七次复盘 F3）。
          runbook: "internal/control/quota_refresh.go QuotaReconciler"
          threshold_source: >-
            uncalibrated。`for: 15m` 是"偶发可容忍、持续不可容忍"的取值，对账周期为 1 分钟，
            故 15m 意味着连续多轮未排干；真实基线未知，需上线后回看。
            用 `or` 而非正则匹配器：本规则文件此前没有任何 `=~` 先例。
            A27：本规则读的 gauge 只在一次**成功**对账之后才写，在那之前序列不存在，
            `time()` 减一个缺失的序列得到空向量，整条规则不产生结果——promtool 实测：
            跑到 3 小时仍无结果。而"从来没跑起来过"正是它唯一该管的状态。
            `ReconciliationLoop.PrimeMetrics` 在进程启动时把该 gauge 种为**启动时刻**
            （不是 epoch：种 epoch 会让告警从开机起为真、在首个 tick 清掉它之前就误报）。
            这给了告警一个恰好等于自身阈值的宽限期：一个从未成功对账的进程在 1 小时后告警，
            正常启动不会误报。该 gauge 的值是"没有比本进程更早的成功"的代理，
            不是"启动时跑成功过一次"的断言。
            A27：本规则是 `== 0` 而非 `> 0`，与 A23 的 StreamPendingStuck 同形状——
            `control_billing_reconcile_balanced` 只在一次成功对账之后才写，序列不存在时
            规则不产生结果（promtool 实测：3 小时仍无结果）。
            该 gauge **有意不预置**：种 1 等于断言一本从没核过的账是平的，
            种 0 等于每次进程启动都报一条 critical。
            "对账从未成功"这一状态改由 BillingReconciliationNotRunning 覆盖，
            它的时间戳 gauge 在启动时就被种上。**本规则的可见性依赖那一条。**
